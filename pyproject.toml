[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promoter-variant-transformer"
version = "0.1.0"
description = "Rotary Position Embedding (RoPE) Transformer for Non-Coding Oncogenic Promoter Mutation Prediction and In Silico Saturation Mutagenesis"
readme = "README.md"
authors = [{ name = "Elham", email = "elham4ml.ai@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "matplotlib>=3.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
